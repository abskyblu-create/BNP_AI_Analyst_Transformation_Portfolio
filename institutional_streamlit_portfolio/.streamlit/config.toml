# Design tokens — "Glass layers" redesign.
# Ledger White page, Ink text, Ledger Green theme with Settlement Blue as the
# supporting accent. Green / red / amber are reserved for result status.

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-400-italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-800.woff2"
weight = 800

[theme]
base = "light"
font = "'IBM Plex Sans', sans-serif"
headingFont = "'Bricolage Grotesque', 'IBM Plex Sans', sans-serif"
primaryColor = "#0B7A5C"
linkColor = "#2448D8"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EDF4F1"
textColor = "#0E1A2B"
borderColor = "#D6E2DD"
baseFontSize = 18
headingFontSizes = ["2.6rem", "1.9rem", "1.45rem", "1.2rem"]
headingFontWeights = [800, 700, 700, 600]
baseRadius = "10px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
codeBackgroundColor = "#EDF4F1"
blueColor = "#2F5BFF"
blueTextColor = "#2448D8"
greenColor = "#0FA47A"
greenTextColor = "#0B7A5C"
greenBackgroundColor = "#DDF5EC"
redColor = "#E5484D"
redTextColor = "#C2343A"
redBackgroundColor = "#FDE4E5"
orangeColor = "#F5A524"
orangeTextColor = "#9A5B00"
orangeBackgroundColor = "#FEF0D7"
grayColor = "#5B6B82"
chartCategoricalColors = ["#0B7A5C", "#2F5BFF", "#F5A524", "#7FD8B6", "#E5484D", "#5B6B82", "#0E1A2B"]
dataframeHeaderBackgroundColor = "#E3EFEA"
dataframeBorderColor = "#D6E2DD"

[theme.sidebar]
backgroundColor = "#0B201C"
secondaryBackgroundColor = "#13302A"
textColor = "#E6F2EE"
primaryColor = "#5FD3A8"
linkColor = "#5FD3A8"
borderColor = "#1E3F37"
codeBackgroundColor = "#13302A"

[server]
headless = true
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
