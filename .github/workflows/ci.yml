name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publication safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checksum-pinned offline scanner
        run: python scripts/setup_safeguards.py
      - name: Check committed inventory and complete history
        run: python scripts/publication_guard.py ci
      - name: Verify safeguards with synthetic fixtures
        run: python -m unittest discover -s scripts -p test_publication_guard.py -v

  validate:
    name: Validate application
    needs: publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: institutional_streamlit_portfolio/requirements.txt
      - run: pip install -r institutional_streamlit_portfolio/requirements.txt
      - name: Structural and workflow checks
        working-directory: institutional_streamlit_portfolio
        run: |
          python validate.py
          python -m unittest test_workflows.py -v

  container:
    name: Build and smoke test container
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Build and wait for health check
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check HTTP health endpoint
        run: curl --fail http://127.0.0.1:8501/_stcore/health
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Export tested image
        run: |
          docker tag "$(docker compose images -q app)" "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker save "${{ steps.image.outputs.name }}:${{ github.sha }}" -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          name: tested-container
          path: /tmp/image.tar
          retention-days: 1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down

  publish:
    name: Publish tested image
    needs: container
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-container
          path: /tmp
      - name: Publish to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker load -i /tmp/image.tar
          docker tag "$image:$COMMIT_SHA" "$image:latest"
          docker push "$image:$COMMIT_SHA"
          docker push "$image:latest"
          docker logout ghcr.io
